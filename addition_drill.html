<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足し算・引き算ドリル</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: safe center;
    padding: 24px 0;
    color: #333;
  }

  .card {
    background: #ffffff;
    width: 90%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    text-align: center;
    transition: max-width 0.2s ease;
  }

  .card.result-mode {
    max-width: 620px;
  }

  h1 {
    font-size: 22px;
    color: #4a6fa5;
    margin-bottom: 18px;
  }

  .progress {
    color: #718096;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  .question {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  .answer-row {
    display: grid;
    grid-template-columns: minmax(90px, 110px) 1fr 1.2fr;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 20px;
  }

  #answer {
    width: 100%;
    padding: 10px;
    font-size: 26px;
    text-align: center;
    border: 2px solid #c3d0dd;
    border-radius: 8px;
    outline: none;
  }

  #answer:focus {
    border-color: #4a6fa5;
  }

  button {
    padding: 12px 16px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }

  button:hover:not(:disabled) {
    opacity: 0.85;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  #submit-btn {
    background: #4a6fa5;
    color: #fff;
  }

  #next-btn {
    background: #5cb85c;
    color: #fff;
  }

  .message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  .message.correct { color: #2e9e44; }
  .message.wrong   { color: #d9534f; }

  .screen-hidden {
    display: none !important;
  }

  .result {
    padding-top: 8px;
  }

  .result h2 {
    color: #4a6fa5;
    font-size: 28px;
    margin-bottom: 24px;
  }

  .result-score {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .result-rate {
    color: #5f6c7b;
    font-size: 20px;
    margin-bottom: 28px;
  }

  .history-title {
    border-top: 1px solid #dce3ea;
    color: #4a6fa5;
    font-size: 22px;
    margin: 8px 0 16px;
    padding-top: 24px;
  }

  .history-list {
    display: grid;
    gap: 12px;
    margin-bottom: 28px;
    text-align: left;
  }

  .history-item {
    background: #f7f9fc;
    border-left: 5px solid #5cb85c;
    border-radius: 8px;
    padding: 16px;
  }

  .history-item.wrong-answer {
    background: #fff6f5;
    border-left-color: #d9534f;
  }

  .history-heading {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .history-question {
    font-size: 20px;
    font-weight: bold;
  }

  .history-judgment {
    color: #2e9e44;
    font-weight: bold;
    white-space: nowrap;
  }

  .wrong-answer .history-judgment {
    color: #d9534f;
  }

  .history-answer,
  .history-reason {
    font-size: 16px;
    line-height: 1.7;
  }

  .history-reason {
    color: #5f4b4b;
    margin-top: 4px;
  }

  #restart-btn {
    background: #4a6fa5;
    color: #fff;
  }

  @media (max-width: 400px) {
    .card {
      padding: 32px 16px;
    }

    .answer-row {
      grid-template-columns: minmax(72px, 90px) 1fr 1.3fr;
      gap: 8px;
    }

    #answer {
      font-size: 22px;
    }

    button {
      padding: 10px 8px;
      font-size: 16px;
    }
  }

</style>
</head>
<body>
  <div class="card" id="card">
    <h1>足し算・引き算ドリル</h1>

    <div id="drill">
      <div class="progress" id="progress"></div>
      <div class="question"><span id="num1"></span> <span id="operator"></span> <span id="num2"></span> = ？</div>

      <div class="message" id="message" aria-live="polite"></div>

      <div class="answer-row">
        <input type="number" id="answer" inputmode="numeric" placeholder="答え" aria-label="答え">
        <button id="submit-btn">答える</button>
        <button id="next-btn" disabled>次の問題</button>
      </div>
    </div>

    <div class="result screen-hidden" id="result">
      <h2>結果</h2>
      <div class="result-score" id="result-score"></div>
      <div class="result-rate" id="result-rate"></div>
      <h3 class="history-title">問題の振り返り</h3>
      <div class="history-list" id="history-list"></div>
      <button id="restart-btn">もう一度挑戦する</button>
    </div>
  </div>

<script>
  const num1El     = document.getElementById("num1");
  const num2El     = document.getElementById("num2");
  const operatorEl = document.getElementById("operator");
  const cardEl     = document.getElementById("card");
  const drillEl    = document.getElementById("drill");
  const progressEl = document.getElementById("progress");
  const answerEl   = document.getElementById("answer");
  const submitBtn  = document.getElementById("submit-btn");
  const nextBtn    = document.getElementById("next-btn");
  const messageEl  = document.getElementById("message");
  const resultEl   = document.getElementById("result");
  const resultScoreEl = document.getElementById("result-score");
  const resultRateEl  = document.getElementById("result-rate");
  const historyListEl = document.getElementById("history-list");
  const restartBtn = document.getElementById("restart-btn");

  const totalQuestions = 10;
  let correctAnswer = 0;
  let currentQuestion = 1;
  let correctCount = 0;
  let currentProblem = null;
  let answerHistory = [];

  // 1〜10のランダムな整数を返す
  function randomNumber() {
    return Math.floor(Math.random() * 10) + 1;
  }

  // 新しい問題を出題する
  function newProblem() {
    let a = randomNumber();
    let b = randomNumber();
    const isAddition = Math.random() < 0.5;

    if (isAddition) {
      operatorEl.textContent = "＋";
      correctAnswer = a + b;
    } else {
      // 答えがマイナスにならないよう、大きい数を左側にする
      if (a < b) [a, b] = [b, a];
      operatorEl.textContent = "−";
      correctAnswer = a - b;
    }

    num1El.textContent = a;
    num2El.textContent = b;
    currentProblem = {
      number: currentQuestion,
      left: a,
      right: b,
      operator: operatorEl.textContent,
      correctAnswer
    };
    progressEl.textContent = `${currentQuestion} / ${totalQuestions} 問`;

    messageEl.textContent = "";
    messageEl.className = "message";

    answerEl.value = "";
    answerEl.disabled = false;
    submitBtn.disabled = false;
    nextBtn.disabled = true;
    nextBtn.textContent = "次の問題";

    answerEl.focus();
  }

  // 答え合わせ
  function checkAnswer() {
    const input = answerEl.value.trim();
    if (input === "") return; // 空欄のときは何もしない

    const isCorrect = Number(input) === correctAnswer;
    const userAnswer = Number(input);

    answerHistory.push({
      ...currentProblem,
      userAnswer,
      isCorrect
    });

    if (isCorrect) {
      correctCount++;
      messageEl.textContent = "正解！";
      messageEl.className = "message correct";
    } else {
      messageEl.textContent = `不正解。正解は${correctAnswer}です。`;
      messageEl.className = "message wrong";
    }

    // 正誤を確認してから次へ進めるよう、回答を確定する
    answerEl.disabled = true;
    submitBtn.disabled = true;
    nextBtn.disabled = false;
    if (currentQuestion >= totalQuestions) {
      nextBtn.textContent = "結果を見る";
    }
    nextBtn.focus();
  }

  // 10問終了後に成績を表示する
  function showResult() {
    const percentage = Math.round((correctCount / totalQuestions) * 100);
    resultScoreEl.textContent = `${totalQuestions}問中 ${correctCount}問正解！`;
    resultRateEl.textContent = `正答率 ${percentage}%`;
    renderHistory();
    cardEl.classList.add("result-mode");
    drillEl.classList.add("screen-hidden");
    resultEl.classList.remove("screen-hidden");
    restartBtn.focus();
  }

  // 正しい計算方法と、入力した答えがどれだけ違ったかを説明する
  function createReasonText(answer) {
    if (answer.isCorrect) {
      return "正しく計算できています。";
    }

    const calculation = answer.operator === "＋"
      ? `${answer.left}と${answer.right}を足すと${answer.correctAnswer}です。`
      : `${answer.left}から${answer.right}を引くと${answer.correctAnswer}です。`;
    const difference = Math.abs(answer.userAnswer - answer.correctAnswer);
    const comparison = answer.userAnswer > answer.correctAnswer
      ? `あなたの答えは正解より${difference}大きくなっています。`
      : `あなたの答えは正解より${difference}小さくなっています。`;

    return `${calculation}${comparison}`;
  }

  // 全問題の式・回答・正解・振り返りを結果画面に表示する
  function renderHistory() {
    historyListEl.replaceChildren();

    answerHistory.forEach((answer) => {
      const item = document.createElement("div");
      item.className = `history-item${answer.isCorrect ? "" : " wrong-answer"}`;

      const heading = document.createElement("div");
      heading.className = "history-heading";

      const question = document.createElement("div");
      question.className = "history-question";
      question.textContent = `${answer.number}. ${answer.left} ${answer.operator} ${answer.right} = ${answer.correctAnswer}`;

      const judgment = document.createElement("div");
      judgment.className = "history-judgment";
      judgment.textContent = answer.isCorrect ? "正解" : "不正解";

      const submittedAnswer = document.createElement("div");
      submittedAnswer.className = "history-answer";
      submittedAnswer.textContent = `あなたの答え：${answer.userAnswer} ／ 正解：${answer.correctAnswer}`;

      const reason = document.createElement("div");
      reason.className = "history-reason";
      reason.textContent = createReasonText(answer);

      heading.append(question, judgment);
      item.append(heading, submittedAnswer, reason);
      historyListEl.append(item);
    });
  }

  // 成績をリセットして1問目から始める
  function startDrill() {
    currentQuestion = 1;
    correctCount = 0;
    answerHistory = [];
    historyListEl.replaceChildren();
    cardEl.classList.remove("result-mode");
    drillEl.classList.remove("screen-hidden");
    resultEl.classList.add("screen-hidden");
    newProblem();
  }

  submitBtn.addEventListener("click", checkAnswer);

  // Enterキーでも答えられるようにする
  answerEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkAnswer();
  });

  nextBtn.addEventListener("click", () => {
    if (currentQuestion >= totalQuestions) {
      showResult();
    } else {
      currentQuestion++;
      newProblem();
    }
  });
  restartBtn.addEventListener("click", startDrill);

  startDrill();
</script>
</body>
</html>
