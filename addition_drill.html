<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足し算・引き算ドリル</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
  }

  .card {
    background: #ffffff;
    width: 90%;
    max-width: 420px;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  h1 {
    font-size: 22px;
    color: #4a6fa5;
    margin-bottom: 18px;
  }

  .progress {
    color: #718096;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  .question {
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  .answer-row {
    display: grid;
    grid-template-columns: minmax(90px, 110px) 1fr 1.2fr;
    align-items: stretch;
    gap: 12px;
    margin-bottom: 20px;
  }

  #answer {
    width: 100%;
    padding: 10px;
    font-size: 26px;
    text-align: center;
    border: 2px solid #c3d0dd;
    border-radius: 8px;
    outline: none;
  }

  #answer:focus {
    border-color: #4a6fa5;
  }

  button {
    padding: 12px 16px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }

  button:hover:not(:disabled) {
    opacity: 0.85;
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  #submit-btn {
    background: #4a6fa5;
    color: #fff;
  }

  #next-btn {
    background: #5cb85c;
    color: #fff;
  }

  .message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 18px;
  }

  .message.correct { color: #2e9e44; }
  .message.wrong   { color: #d9534f; }

  .screen-hidden {
    display: none !important;
  }

  .result {
    padding-top: 8px;
  }

  .result h2 {
    color: #4a6fa5;
    font-size: 28px;
    margin-bottom: 24px;
  }

  .result-score {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .result-rate {
    color: #5f6c7b;
    font-size: 20px;
    margin-bottom: 28px;
  }

  #restart-btn {
    background: #4a6fa5;
    color: #fff;
  }

  @media (max-width: 400px) {
    .card {
      padding: 32px 16px;
    }

    .answer-row {
      grid-template-columns: minmax(72px, 90px) 1fr 1.3fr;
      gap: 8px;
    }

    #answer {
      font-size: 22px;
    }

    button {
      padding: 10px 8px;
      font-size: 16px;
    }
  }

</style>
</head>
<body>
  <div class="card">
    <h1>足し算・引き算ドリル</h1>

    <div id="drill">
      <div class="progress" id="progress"></div>
      <div class="question"><span id="num1"></span> <span id="operator"></span> <span id="num2"></span> = ？</div>

      <div class="answer-row">
        <input type="number" id="answer" inputmode="numeric" placeholder="答え" aria-label="答え">
        <button id="submit-btn">答える</button>
        <button id="next-btn" disabled>次の問題</button>
      </div>

      <div class="message" id="message" aria-live="polite"></div>
    </div>

    <div class="result screen-hidden" id="result">
      <h2>結果</h2>
      <div class="result-score" id="result-score"></div>
      <div class="result-rate" id="result-rate"></div>
      <button id="restart-btn">もう一度挑戦する</button>
    </div>
  </div>

<script>
  const num1El     = document.getElementById("num1");
  const num2El     = document.getElementById("num2");
  const operatorEl = document.getElementById("operator");
  const drillEl    = document.getElementById("drill");
  const progressEl = document.getElementById("progress");
  const answerEl   = document.getElementById("answer");
  const submitBtn  = document.getElementById("submit-btn");
  const nextBtn    = document.getElementById("next-btn");
  const messageEl  = document.getElementById("message");
  const resultEl   = document.getElementById("result");
  const resultScoreEl = document.getElementById("result-score");
  const resultRateEl  = document.getElementById("result-rate");
  const restartBtn = document.getElementById("restart-btn");

  const totalQuestions = 10;
  let correctAnswer = 0;
  let currentQuestion = 1;
  let correctCount = 0;
  let isFirstAttempt = true;

  // 1〜10のランダムな整数を返す
  function randomNumber() {
    return Math.floor(Math.random() * 10) + 1;
  }

  // 新しい問題を出題する
  function newProblem() {
    let a = randomNumber();
    let b = randomNumber();
    const isAddition = Math.random() < 0.5;

    if (isAddition) {
      operatorEl.textContent = "＋";
      correctAnswer = a + b;
    } else {
      // 答えがマイナスにならないよう、大きい数を左側にする
      if (a < b) [a, b] = [b, a];
      operatorEl.textContent = "−";
      correctAnswer = a - b;
    }

    num1El.textContent = a;
    num2El.textContent = b;
    progressEl.textContent = `${currentQuestion} / ${totalQuestions} 問`;
    isFirstAttempt = true;

    messageEl.textContent = "";
    messageEl.className = "message";

    answerEl.value = "";
    answerEl.disabled = false;
    submitBtn.disabled = false;
    nextBtn.disabled = true;

    answerEl.focus();
  }

  // 答え合わせ
  function checkAnswer() {
    const input = answerEl.value.trim();
    if (input === "") return; // 空欄のときは何もしない

    const isCorrect = Number(input) === correctAnswer;

    if (isFirstAttempt) {
      if (isCorrect) correctCount++;
      isFirstAttempt = false;
    }

    if (isCorrect) {
      messageEl.textContent = "正解！";
      messageEl.className = "message correct";
      answerEl.disabled = true;
      submitBtn.disabled = true;

      if (currentQuestion >= totalQuestions) {
        showResult();
      } else {
        nextBtn.disabled = false;
        nextBtn.focus();
      }
    } else {
      messageEl.textContent = "もう一度";
      messageEl.className = "message wrong";
      answerEl.select(); // 入力し直しやすくする
    }
  }

  // 10問終了後に成績を表示する
  function showResult() {
    const percentage = Math.round((correctCount / totalQuestions) * 100);
    resultScoreEl.textContent = `${totalQuestions}問中 ${correctCount}問正解！`;
    resultRateEl.textContent = `正答率 ${percentage}%`;
    drillEl.classList.add("screen-hidden");
    resultEl.classList.remove("screen-hidden");
    restartBtn.focus();
  }

  // 成績をリセットして1問目から始める
  function startDrill() {
    currentQuestion = 1;
    correctCount = 0;
    drillEl.classList.remove("screen-hidden");
    resultEl.classList.add("screen-hidden");
    newProblem();
  }

  submitBtn.addEventListener("click", checkAnswer);

  // Enterキーでも答えられるようにする
  answerEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkAnswer();
  });

  nextBtn.addEventListener("click", () => {
    currentQuestion++;
    newProblem();
  });
  restartBtn.addEventListener("click", startDrill);

  startDrill();
</script>
</body>
</html>
